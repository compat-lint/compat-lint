name: Test
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  ast-metadata-inferer:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      # https://pptr.dev/troubleshooting#issues-with-apparmor-on-ubuntu
      - name: Allow Chrome sandbox
        run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter @compat-lint/ast-metadata-inferer run lint
      # Also generates lib, metadata.json and compat.json
      - name: Test
        run: pnpm --filter @compat-lint/ast-metadata-inferer run test
      - name: Upload generated data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ast-metadata-inferer
          path: |
            packages/ast-metadata-inferer/lib
            packages/ast-metadata-inferer/compat.json
            packages/ast-metadata-inferer/metadata.json
          retention-days: 1

  eslint-plugin-compat:
    needs: ast-metadata-inferer
    runs-on: ubuntu-latest
    strategy:
      matrix:
        eslint-version: [9, 10]
    name: eslint-plugin-compat (ESLint ${{ matrix.eslint-version }})
    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # The plugin reads the inferer's generated data and types from the workspace
      - name: Download generated data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ast-metadata-inferer
          path: packages/ast-metadata-inferer
      - name: Install ESLint ${{ matrix.eslint-version }}
        run: pnpm --filter @compat-lint/eslint-plugin-compat add -D eslint@${{ matrix.eslint-version }}
      - name: Run tests
        working-directory: packages/eslint-plugin-compat
        run: pnpm run build && pnpm run spec --testPathIgnorePatterns="test/e2e-repo.spec.ts|test/flat-config-typing.spec.ts"
