name: Version
on:
  push:
    branches:
      - main
permissions: {}
concurrency: ${{ github.workflow }}-${{ github.ref }}
jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Push the version branch
      pull-requests: write # Open the "Version Packages" pull request
    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      # Publishing happens on the version tag, see release.yml
      - name: Create version pull request
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version: pnpm run version
          title: "chore: Version packages"
          commit: "chore: Version packages"
        env:
          GITHUB_TOKEN: ${{ github.token }}
