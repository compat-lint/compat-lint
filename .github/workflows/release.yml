name: Release

# Publish both packages by pushing the version tag after the "Version Packages" pull request is
# merged, e.g. `git tag v8.0.0 && git push origin v8.0.0`
on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # Create the GitHub release
      id-token: write # Required for npm trusted publishing (OIDC)

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm # Trusted publishing requires npm >= 11.5.1
        run: npm install -g npm@11

      - name: Check tag matches package versions
        run: |
          for package in packages/*; do
            version="$(node -p "require('./$package/package.json').version")"
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match $package version $version"
              exit 1
            fi
          done

      # https://pptr.dev/troubleshooting#issues-with-apparmor-on-ubuntu
      - name: Allow Chrome sandbox
        run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Also builds lib and generates metadata.json and compat.json
      - name: Test ast-metadata-inferer
        run: pnpm --filter @compat-lint/ast-metadata-inferer run test

      - name: Test eslint-plugin-compat
        working-directory: packages/eslint-plugin-compat
        run: pnpm run build && pnpm run spec --testPathIgnorePatterns="test/e2e-repo.spec.ts|test/flat-config-typing.spec.ts"

      # pnpm replaces the workspace: dependency with the released version; npm publishes via OIDC
      - name: Pack
        run: pnpm --recursive pack --pack-destination "$PWD/dist"

      - name: Publish to npm
        run: |
          # Prereleases like 1.2.3-beta.0 must not become `latest`
          tag="latest"
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            tag="next"
          fi
          # The plugin depends on the inferer, so the inferer goes first. The `./` makes npm read
          # a file path; `dist/…` alone is taken as a GitHub repo shorthand.
          version="${GITHUB_REF_NAME#v}"
          npm publish "./dist/compat-lint-ast-metadata-inferer-$version.tgz" --tag "$tag"
          npm publish "./dist/compat-lint-eslint-plugin-compat-$version.tgz" --tag "$tag"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Creating the release on GitHub also pushes the tag that started this run
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"
            exit 0
          fi
          prerelease=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease="--prerelease"
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes $prerelease
